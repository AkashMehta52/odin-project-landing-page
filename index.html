<!DOCTYPE html>

            </div>
            <div class="nav_link">

            </div>
            <div class="nav_link">
                <p class="nav_link_text">header link three</p>
            </div>
        </div>
        <div class="top_quarter_fb">
            <div class="left_box">
                <div class="top"></div>

            </div>
            <div class="right_box">

                <div class="box_container">

                </div>
            </div>
        </div>
        <div class="third_quarter_fb">
            <div class="hero_text"></div>
            <div class="author_line"></div>
        </div>
        <div class="last_quarter_fb">
            <div class="centered_button_fb">
                <div class="button_content_left">
                    <div class="button_left_top_text"></div>
                    <div class="button_left_bottom_text"></div>
                </div>
                <div class="button_right"></div>
            </div>
        </div>
        <div class="footer_fb">
            <div class="centered_footer_text"></div>
        </div>
    </div>
</body>
</html>
