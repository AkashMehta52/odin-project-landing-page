<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="outer_fb">
        <div class ="centered_fb">
            <div class="nav">
                <h2 class="header_text">Header Logo</h2>
                <p class="nav_link_text">header link one</p>
                <p class="nav_link_text">header link two</p>
                <p class="nav_link_text">header link three</p>
            </div>
            <div class="top_quarter_fb">
                <div class="left_box">
                    <h1 class="top">This website is awesome</h1>
                    <h3 class="bottom">This website has some subtext that goes here under the main title. It's a smaller font and the color is lower contrast</h3>
                    <button class="button">Sign Up</button>
                </div>
                <div class="right_box">
                    <img class="recipe_image" src="./images/chole.jpg" height="200px" width="300px">
                </div>
            </div>
            <div class="second_quarter">
                <h1 class="text">some random information!</h1>
                <div class="box_container_fb">
                    <div class="box_container">
                        <div class="box"></div>
                        <div class="text"></div>
                    </div>
                    <div class="box_container">
                        <div class="box"></div>
                        <div class="text"></div>
                    </div>
                    <div class="box_container">
                        <div class="box"></div>
                        <div class="text"></div>
                    </div>
                    <div class="box_container">
                        <div class="box"></div>
                        <div class="text"></div>
                    </div>
                </div>
            </div>
            <div class="third_quarter_fb">
                <div class="hero_text"></div>
                <div class="author_line"></div>
            </div>
            <div class="last_quarter_fb">
                <div class="centered_button_fb">
                    <div class="button_content_left">
                        <div class="button_left_top_text"></div>
                        <div class="button_left_bottom_text"></div>
                    </div>
                    <div class="button_right"></div>
                </div>
            </div>
            <div class="footer_fb">
                <div class="centered_footer_text"></div>
            </div>
        </div>
    </div>
</body>
</html>
